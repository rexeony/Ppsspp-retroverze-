name: Build PPSSPP RetroVerze Edition (APK ARM64)

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Repo PPSSPP sumber (harus ada submodule)"
        required: true
        default: "hrydgard/ppsspp"
      upstream_ref:
        description: "Tag/branch PPSSPP (harus sama dengan versi source yang dipakai)"
        required: true
        default: "v1.20.4"

jobs:
  apk:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo RetroVerze (overlay + skrip)
        uses: actions/checkout@v4
        with:
          path: retroverze

      - name: Clone PPSSPP + submodule
        run: |
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            --branch "${{ github.event.inputs.upstream_ref }}" \
            "https://github.com/${{ github.event.inputs.upstream_repo }}.git" ppsspp

      - name: Terapkan perubahan RetroVerze
        run: bash retroverze/apply_retroverze.sh ppsspp

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Siapkan keystore (pakai secret jika ada, kalau tidak buat otomatis)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > signing/retroverze-release.jks
            PASS="$S_PASS"; ALIAS="${S_ALIAS:-retroverze}"; KEYPASS="${S_KEYPASS:-$S_PASS}"
          else
            echo "Secret keystore tidak ada -> membuat keystore baru otomatis"
            PASS="$(openssl rand -hex 16)"; ALIAS="retroverze"; KEYPASS="$PASS"
            keytool -genkeypair -keystore signing/retroverze-release.jks \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KEYPASS" \
              -dname "CN=PPSSPP RetroVerze, O=RetroVerze, C=ID"
            printf 'alias=%s\nstorepass=%s\nkeypass=%s\n' "$ALIAS" "$PASS" "$KEYPASS" > signing/KEYSTORE-INFO.txt
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
          fi
          echo "::add-mask::$PASS"; echo "::add-mask::$KEYPASS"
          {
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/signing/retroverze-release.jks"
            echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$PASS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$ALIAS"
            echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEYPASS"
          } >> "$GITHUB_ENV"

      - name: Build APK release (ARM64)
        working-directory: ppsspp
        run: |
          chmod +x ./gradlew
          ./gradlew assembleNormalRelease \
            -PRETROVERZE_ARM64_ONLY=true \
            -PANDROID_VERSION_NAME="${{ github.event.inputs.upstream_ref }}-retroverze" \
            -PANDROID_VERSION_CODE=$((1000 + ${{ github.run_number }})) \
            --stacktrace

      - name: Kumpulkan & verifikasi tanda tangan
        run: |
          mkdir -p out
          find ppsspp -name "*.apk" -path "*release*" -exec cp {} out/ \;
          ls -la out
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for f in out/*.apk; do
            "$APKSIGNER" verify --print-certs "$f"
            echo "$f" ; unzip -l "$f" | grep -E "lib/.*/libppsspp_jni.so" || true
          done

      - name: Upload keystore baru (SIMPAN! dibutuhkan untuk update aplikasi)
        if: env.NEW_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: KEYSTORE-SIMPAN-INI
          path: signing/
          retention-days: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP-RetroVerze-arm64
          path: out/*.apk

      - name: Upload log jika gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ppsspp/android/build/reports
            ppsspp/android/.cxx/**/*.log
          if-no-files-found: ignore
          
